name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.event.label.name
    != 'ci:full' && format('labeled-{0}', github.run_id) || github.event_name == 'pull_request'
    && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      pull-requests: read
    env:
      RELEASE_MATRIX: '{"os": ["ubuntu-latest", "windows-latest", "macos-latest"],
        "python-version": ["3.11", "3.12", "3.13"]}'
      FULL_MATRIX: '{"os": ["ubuntu-latest", "windows-latest", "macos-latest"], "python-version":
        ["3.11", "3.12", "3.13"], "exclude": [{"os": "windows-latest", "python-version":
        "3.11"}, {"os": "macos-latest", "python-version": "3.11"}]}'
      APPROVAL_MATRIX: '{"os": ["ubuntu-latest", "windows-latest", "macos-latest"],
        "python-version": ["3.11", "3.12"], "exclude": [{"os": "windows-latest", "python-version":
        "3.11"}, {"os": "macos-latest", "python-version": "3.11"}]}'
      QUICK_MATRIX: '{"os": ["ubuntu-latest"], "python-version": ["3.12"]}'
      PINNED_CONSTRAINTS: .github/constraints/pinned-upstream.txt
    outputs:
      full: ${{ steps.decide.outputs.full }}
      matrix: ${{ steps.decide.outputs.matrix }}
      constraints: ${{ steps.decide.outputs.constraints }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
    - name: Choose the release, full, approval or quick matrix
      id: decide
      env:
        RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
          }}
        FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
          && inputs.matrix != 'approval') || (github.event_name == 'push' && startsWith(github.ref,
          'refs/heads/release/')) }}
        APPROVAL: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name,
          'ci:full')) || (github.event_name == 'workflow_dispatch' && inputs.matrix
          == 'approval') }}
      run: |
        set -euo pipefail
        if [ "$RELEASE" = "true" ]; then
          full=true
          matrix="$RELEASE_MATRIX"
          constraints=""
        elif [ "$FULL" = "true" ]; then
          full=true
          matrix="$FULL_MATRIX"
          constraints=""
        elif [ "$APPROVAL" = "true" ]; then
          full=true
          matrix="$APPROVAL_MATRIX"
          constraints="-c $PINNED_CONSTRAINTS"
        else
          full=false
          matrix="$QUICK_MATRIX"
          constraints="-c $PINNED_CONSTRAINTS"
          echo "::notice title=Quick CI run::lint and test (ubuntu-latest, 3.12) only. A pull request gets the other required test cells and the smoke jobs when a maintainer adds the ci:full label; main gets the full matrix every night."
        fi
        {
          echo "full=$full"
          echo "matrix=$matrix"
          echo "constraints=$constraints"
        } >> "$GITHUB_OUTPUT"
    - name: Detect a docs-only pull request
      id: docs
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
      run: |
        set -u
        docs_only=false
        is_docs() {
          case "$1" in
            docs/*|changelog.d/*|CONTRIBUTORS.md|CONTRIBUTING.md) return 0 ;;
            *) return 1 ;;
          esac
        }
        if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
          if rows=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | [.filename, .previous_filename] | @tsv'); then
            # No file at all reads as ONE blank row, and a blank name is not a docs path,
            # so an empty list counts against `docs_only` without a check of its own.
            total=0
            other=0
            while IFS=$'\t' read -r name previous; do
              total=$((total + 1))
              is_docs "$name" || other=$((other + 1))
              if [ -n "$previous" ]; then
                is_docs "$previous" || other=$((other + 1))
              fi
            done <<< "$rows"
            if [ "$other" -eq 0 ] && [ "$total" = "$CHANGED_FILES" ]; then
              docs_only=true
            fi
          else
            echo "::warning title=Docs-only check::could not read the pull request's file list; running the full set"
          fi
        fi
        echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install ruff
    - run: ruff check src/soup_cli/ scripts/ tests/ benchmarks/
    - name: Lint the workflows themselves
      env:
        ACTIONLINT_VERSION: 1.7.12
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        set -euo pipefail
        url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl --fail --silent --show-error --location --retry 3 --retry-all-errors             --output "${RUNNER_TEMP}/actionlint.tar.gz" "$url"
        echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz"             | sha256sum --check --strict -
        tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
        "${RUNNER_TEMP}/actionlint" -color
  type-check:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.full == 'true' && github.event_name
      != 'pull_request') }}
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install mypy
    - name: mypy (non-blocking)
      run: "mypy || echo \"::warning title=mypy::Type issues reported (non-blocking\
        \ baseline \u2014 see the log above)\"\n"
  torchao-contract:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.full == 'true' && github.event_name
      != 'pull_request') }}
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install the QAT extra (torchao) beside the dev stack
      run: pip install -e ".[dev,qat]" "torch>=2.6.0" ${{ needs.plan.outputs.constraints
        }}
    - name: Prove torchao is actually importable, so the tests do not skip
      run: python -c "import torchao; print(torchao.__version__)"
    - name: Resolve every torchao class Soup asks for
      run: |
        pytest -o addopts= -q \
          tests/test_issue826_torchao_class_names.py \
          tests/test_issue835_fp8_gate.py \
          tests/test_v07121.py
    timeout-minutes: 15
  pytorch-smoke:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.full == 'true') }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v4
      if: needs.plan.outputs.docs_only != 'true'
    - uses: actions/setup-python@v5
      if: needs.plan.outputs.docs_only != 'true'
      with:
        python-version: '3.11'
    - name: Set HF cache location
      if: needs.plan.outputs.docs_only != 'true'
      run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
    - name: Restore PyTorch smoke HF cache
      if: needs.plan.outputs.docs_only != 'true'
      id: hf-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/hf-cache
        key: hf-pytorch-smoke-${{ runner.os }}-${{ hashFiles('tests/test_smoke_train.py',
          'pyproject.toml') }}
        restore-keys: |
          hf-pytorch-smoke-${{ runner.os }}-
    - name: Install training dependencies
      if: needs.plan.outputs.docs_only != 'true'
      env:
        PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      run: pip install -e ".[dev]" "torch>=2.6.0" ${{ needs.plan.outputs.constraints
        }}
    - name: Warm tiny GPT-2 cache
      if: needs.plan.outputs.docs_only != 'true'
      shell: python
      run: |
        from huggingface_hub import snapshot_download

        snapshot_download(
            "sshleifer/tiny-gpt2",
            allow_patterns=["*.json", "*.txt", "*.bin"],
        )
    - name: Run PyTorch smoke tests
      if: needs.plan.outputs.docs_only != 'true'
      run: python -m pytest -o addopts= -m smoke -q tests/
    - name: Save PyTorch smoke HF cache
      if: needs.plan.outputs.docs_only != 'true' && success() && steps.hf-cache.outputs.cache-hit
        != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/hf-cache
        key: hf-pytorch-smoke-${{ runner.os }}-${{ hashFiles('tests/test_smoke_train.py',
          'pyproject.toml') }}
  core-floor:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.full == 'true') }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Isolate core floors from runner tooling
      run: |
        python -m venv "$RUNNER_TEMP/soup-core-floor"
        echo "$RUNNER_TEMP/soup-core-floor/bin" >> "$GITHUB_PATH"
    - name: Install the declared core dependency floors
      run: pip install -e . "pytest>=7,<9" -c .github/constraints/core-floor.txt
    - name: Verify constrained core dependency graph
      run: python -m pip check
    - name: Assert core floor versions
      shell: python
      run: |
        import importlib.metadata as md
        import importlib.util
        import re
        from pathlib import Path

        from packaging.version import Version

        constraints = Path(".github/constraints/core-floor.txt").read_text(encoding="utf-8")
        pairs = re.findall(r"^([A-Za-z0-9_-]+)==([^\s#]+)\s*$", constraints, re.MULTILINE)
        expected = dict(pairs)
        assert expected and len(expected) == len(pairs), "missing or duplicate core pins"
        for name, want in expected.items():
            got = md.version(name)
            assert Version(got) == Version(want), f"core-floor expected {name}=={want}, got {got}"
            print(f"{name}={got} (matches declared floor)")
        for name in ("torch", "transformers", "accelerate", "peft", "trl", "datasets", "bitsandbytes"):
            assert importlib.util.find_spec(name) is None, f"core-floor installed {name}"
    - name: Run core floor command tree, help and startup checks
      run: |
        pytest -o addopts= -q tests/test_core_dependency_floors.py tests/test_cli_dependency_floors.py tests/test_typer_click_compat.py tests/test_cli_runner.py tests/test_click_argument_help.py tests/test_cli_startup_is_light.py tests/test_cli.py tests/test_cli_subprocess.py tests/test_plotext_compat.py tests/test_config_field_types.py
  transformers-floor:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.full == 'true') }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v4
      if: needs.plan.outputs.docs_only != 'true'
    - uses: actions/setup-python@v5
      if: needs.plan.outputs.docs_only != 'true'
      with:
        python-version: '3.11'
    - name: Install with Transformers floor constraints
      if: needs.plan.outputs.docs_only != 'true'
      env:
        PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      run: pip install -e ".[dev,audio]" -c .github/constraints/transformers-floor.txt
    - name: Verify constrained dependency graph
      if: needs.plan.outputs.docs_only != 'true'
      run: python -m pip check
    - name: Assert installed versions match floor constraints
      if: needs.plan.outputs.docs_only != 'true'
      run: "python - <<'PY'\nimport importlib.metadata as md\nimport re\nfrom pathlib\
        \ import Path\n\nfrom packaging.version import Version\n\nconstraints = Path(\"\
        .github/constraints/transformers-floor.txt\").read_text(\n    encoding=\"\
        utf-8\"\n)\npairs = re.findall(\n    r\"^([A-Za-z0-9_-]+)==([^\\s#]+)\\s*$\"\
        ,\n    constraints,\n    re.MULTILINE,\n)\nexpected = dict(pairs)\nassert\
        \ len(expected) == len(pairs), \"duplicate package pin in floor constraints\"\
        \nfor name in (\n    \"torch\", \"torchaudio\", \"transformers\", \"trl\"\
        , \"peft\", \"plotext\",\n    \"typer\", \"click\",  # #1802: the CLI's own\
        \ declared floors\n):\n    assert name in expected, f\"floor constraints missing\
        \ exact {name} pin\"\n    want = expected[name]\n    got = md.version(name)\n\
        \    # The public part: a CPU wheel reports `2.6.0+cpu` for the pin `==2.6.0`.\n\
        \    assert Version(got).public == want, (\n        f\"floor job expected\
        \ {name}=={want} from \"\n        f\".github/constraints/transformers-floor.txt,\
        \ got {got} \u2014 \"\n        f\"pip silently upgraded, ignored -c, or constraints\
        \ drifted\"\n    )\n    print(f\"{name}={got} (matches constraints)\")\nPY\n"
    - name: Prove the pinned torch actually supports trl's FSDP2 path
      if: needs.plan.outputs.docs_only != 'true'
      run: "python - <<'PY'\nimport torch\nimport torch.distributed.fsdp as fsdp\n\
        \nassert hasattr(fsdp, \"FSDPModule\"), (\n    \"torch.distributed.fsdp.FSDPModule\
        \ is absent \u2014 this is the #651 \"\n    \"root cause; the declared torch\
        \ floor does not support trl 0.29\"\n)\nimport trl\nfrom trl import DPOTrainer,\
        \ KTOTrainer\n\nprint(\n    \"trl\",\n    trl.__version__,\n    \"imports\
        \ on torch\",\n    torch.__version__,\n)\nPY\n"
    - name: Run Transformers floor compatibility guard
      if: needs.plan.outputs.docs_only != 'true'
      run: |
        pytest -o addopts= --no-cov -q tests/test_transformers_floor_compat.py tests/test_issue571_qwen4_exp.py tests/test_plotext_compat.py tests/test_bugfixes.py::TestDiffModelLoading tests/test_issue636_torch_floor.py tests/test_issue265_xcodec2_audio_contract.py tests/test_native_csm.py tests/test_cli_dependency_floors.py tests/test_click_argument_help.py tests/test_cli_startup_is_light.py tests/test_typer_click_compat.py tests/test_cli_help_completeness.py tests/test_cli_help_markup.py tests/test_gen_reference_docs.py tests/test_cli_runner.py
  typer-vendored:
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name
      == 'workflow_dispatch') }}
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned vendored Typer compatibility lane
      run: python -m pip install -e . "pytest>=7,<9" "typer==0.27.3" "click==8.4.2"
    - name: Verify pinned vendored identities and compatibility scenarios
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        HF_HUB_OFFLINE: '1'
        TRANSFORMERS_OFFLINE: '1'
      run: |
        python - <<'PY'
        import json
        from importlib.metadata import version
        import click
        from typer._click.core import Command, Context, ParameterSource
        from typer._click.exceptions import MissingParameter, UsageError
        from typer.core import TyperGroup
        from typer.main import get_command
        from soup_cli.cli import app
        from soup_cli.utils import typer_compat

        installed = {name: version(name) for name in ("typer", "click")}
        assert installed == {"typer": "0.27.3", "click": "8.4.2"}, installed
        assert TyperGroup.__bases__[0] is Command
        root = get_command(app)
        assert isinstance(root, Command) and not isinstance(root, click.Command)
        assert typer_compat.UsageError is UsageError and UsageError is not click.UsageError
        assert typer_compat.MissingParameter is MissingParameter
        assert MissingParameter is not click.MissingParameter
        assert typer_compat.ParameterSource is ParameterSource
        assert ParameterSource is not click.core.ParameterSource
        with root.commands["ship"].make_context("ship", []) as context:
            assert isinstance(context, Context)
            assert context.get_parameter_source("forgetting_threshold") is ParameterSource.DEFAULT
        print(json.dumps({**installed, "command_base": Command.__module__,
                          "usage_error": UsageError.__module__,
                          "parameter_source": ParameterSource.__module__}, sort_keys=True))
        PY
        python -m pytest -o addopts= tests/test_typer_click_compat.py -q
  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      RUN_SUITE: ${{ needs.plan.outputs.docs_only != 'true' || (matrix.os == 'ubuntu-latest'
        && matrix.python-version == '3.12') }}
      REUSE_CELL: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        && matrix.python-version == '3.12' }}
      ONEDNN_MAX_CPU_ISA: ${{ matrix.os == 'windows-latest' && 'AVX512_CORE' || ''
        }}
    steps:
    - name: Look for the green result of this merge commit
      id: reuse
      if: env.RUN_SUITE == 'true' && env.REUSE_CELL == 'true'
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/suite-green
        key: suite-green-v1-${{ github.sha }}-${{ matrix.os }}-${{ matrix.python-version
          }}
    - name: Say which run's result is reused
      if: env.RUN_SUITE == 'true' && steps.reuse.outputs.cache-hit == 'true'
      continue-on-error: true
      timeout-minutes: 5
      shell: bash
      run: |
        result=$(cat "$RUNNER_TEMP/suite-green/result" 2>/dev/null || true)
        pattern='^run [0-9]+ attempt [0-9]+$'
        if [[ "$result" =~ $pattern ]]; then
          echo "::notice title=Suite result reused::this exact merge commit passed the suite in ${result}; nothing is run again"
        else
          echo "::notice title=Suite result reused::this exact merge commit passed the suite earlier; nothing is run again"
        fi
    - uses: actions/checkout@v4
      if: env.RUN_SUITE == 'true' && steps.reuse.outputs.cache-hit != 'true'
    - uses: actions/setup-python@v5
      if: env.RUN_SUITE == 'true' && steps.reuse.outputs.cache-hit != 'true'
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/setup-node@v4
      if: env.RUN_SUITE == 'true' && steps.reuse.outputs.cache-hit != 'true'
      with:
        node-version: '22'
    - name: Pin the HF cache to a deterministic path
      if: env.RUN_SUITE == 'true' && steps.reuse.outputs.cache-hit != 'true'
      shell: bash
      run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
    - name: Restore HF Hub cache
      if: env.RUN_SUITE == 'true' && steps.reuse.outputs.cache-hit != 'true'
      id: hf-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/hf-cache
        key: hf-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
        restore-keys: hf-${{ runner.os }}-
    - name: Install dependencies
      if: env.RUN_SUITE == 'true' && steps.reuse.outputs.cache-hit != 'true'
      env:
        PIP_EXTRA_INDEX_URL: ${{ runner.os == 'Linux' && 'https://download.pytorch.org/whl/cpu'
          || '' }}
      run: pip install -e ".[dev]" "pytest-xdist[psutil]" ${{ needs.plan.outputs.constraints
        }}
    - name: Print the host CPU
      if: env.RUN_SUITE == 'true' && matrix.os == 'windows-latest' && steps.reuse.outputs.cache-hit
        != 'true'
      continue-on-error: true
      timeout-minutes: 5
      shell: pwsh
      run: |
        Write-Output "PROCESSOR_IDENTIFIER=$env:PROCESSOR_IDENTIFIER"
        Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List
        python -c "import torch; print('torch cpu capability:', torch.backends.cpu.get_cpu_capability())"
        Write-Output "ONEDNN_MAX_CPU_ISA=$env:ONEDNN_MAX_CPU_ISA"
        python -c "import torch; print('torch sees avx512_bf16:', torch.cpu._is_avx512_bf16_supported(), 'amx_tile:', torch.cpu._is_amx_tile_supported())"
        $env:ONEDNN_VERBOSE = "1"
        python -c "import torch; torch.mkldnn_convolution(torch.randn(1, 3, 8, 8), torch.randn(4, 3, 3, 3), None, (0, 0), (1, 1), (1, 1), 1)" 2>&1 | Select-String -SimpleMatch "info,cpu,isa"
    - name: Warm HF Hub cache (models the tests load)
      if: env.RUN_SUITE == 'true' && steps.reuse.outputs.cache-hit != 'true'
      id: warm
      shell: python
      env:
        HF_HUB_DISABLE_XET: '1'
      run: "import os\nimport time\nfrom huggingface_hub import snapshot_download\n\
        \n# Per-repo file sets, also empirical: these are the files a populated\n\
        # local cache actually holds after running the suite. Downloading\n# whole\
        \ snapshots instead costs 1.6 GB per cell \u2014 mostly the TF /\n# Flax copies\
        \ and the pytorch_model.bin twin of a safetensors file\n# that transformers\
        \ never opens when safetensors is present.\nTEXT_ONLY = [\"*.json\", \"*.txt\"\
        , \"*.model\"]      # config + tokenizer\nSAFETENSORS = TEXT_ONLY + [\"*.safetensors\"\
        ]\n# Two of the fixture repos predate safetensors and ship weights ONLY\n\
        # as pytorch_model.bin. Both are a few MB, so pulling the .bin costs\n# nothing\
        \ here \u2014 but excluding it left the ASR test unable to build a\n# model\
        \ offline, which a full offline run of the suite caught.\nLEGACY_BIN = TEXT_ONLY\
        \ + [\"*.bin\"]\n\nmodels = [\n    (\"sshleifer/tiny-gpt2\", LEGACY_BIN),\n\
        \    (\"hf-internal-testing/tiny-random-gpt2\", SAFETENSORS),\n    (\"hf-internal-testing/tiny-random-LlamaForCausalLM\"\
        , SAFETENSORS),\n    (\"hf-internal-testing/tiny-random-WhisperForConditionalGeneration\"\
        , LEGACY_BIN),\n    # Weights are never loaded for these two \u2014 only the\
        \ config the\n    # 429 above was raised on.\n    (\"HuggingFaceTB/SmolLM2-135M\"\
        , TEXT_ONLY),\n    (\"HuggingFaceTB/SmolLM2-135M-Instruct\", TEXT_ONLY),\n\
        \    (\"gpt2\", SAFETENSORS),\n]\n\n# One budget for the whole list, not per\
        \ repo. Run 30947949103\n# showed why: on windows/3.11 ALL SIX repos failed\
        \ EVERY attempt,\n# including the tiny fixtures every other cell fetched in\
        \ under a\n# second. The Hub had cut that runner off for the duration \u2014\
        \ so\n# burning a fresh retry ladder on repo #2 the moment repo #1 gave up\n\
        # just spends the budget faster without ever waiting out the block.\ndeadline\
        \ = time.monotonic() + 120\npending = list(models)\ndelay = 10\n\nwhile pending\
        \ and time.monotonic() < deadline:\n    still_pending = []\n    for repo,\
        \ allow in pending:\n        try:\n            snapshot_download(repo, allow_patterns=allow)\n\
        \            print(f\"warmed {repo}\")\n        except Exception as exc: \
        \ # noqa: BLE001 \u2014 best effort, never fail the job\n            print(f\"\
        {repo}: {type(exc).__name__}: {exc}\")\n            still_pending.append((repo,\
        \ allow))\n    pending = still_pending\n    if pending:\n        print(f\"\
        {len(pending)} repo(s) left; retrying in {delay}s\")\n        time.sleep(delay)\n\
        \        delay = min(delay * 2, 60)\n\nfor repo, _ in pending:\n    print(f\"\
        ::warning title=HF cache::could not warm {repo} within the retry budget\"\
        )\n\nwith open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as\
        \ fh:\n    fh.write(f\"warmed={'partial' if pending else 'all'}\\n\")\n"
    - name: Save HF Hub cache
      if: always() && env.RUN_SUITE == 'true' && steps.warm.outputs.warmed == 'all'
        && steps.hf-cache.outputs.cache-hit != 'true' && steps.reuse.outputs.cache-hit
        != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/hf-cache
        key: hf-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
    - name: Run unit tests with coverage
      if: env.RUN_SUITE == 'true' && github.event_name != 'pull_request' && matrix.os
        == 'ubuntu-latest' && matrix.python-version == '3.11' && steps.reuse.outputs.cache-hit
        != 'true'
      timeout-minutes: 15
      run: pytest tests/ -n logical --dist loadfile -v --tb=short -o faulthandler_timeout=300
        --timeout=600 --timeout-method=thread --max-worker-restart=2 --junitxml=report.xml
        --cov=soup_cli --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered
    - name: Run unit tests without coverage
      id: suite
      if: env.RUN_SUITE == 'true' && (github.event_name == 'pull_request' || matrix.os
        != 'ubuntu-latest' || matrix.python-version != '3.11') && steps.reuse.outputs.cache-hit
        != 'true'
      timeout-minutes: 15
      run: pytest tests/ -n logical --dist loadfile -v --tb=short -o faulthandler_timeout=300
        --timeout=600 --timeout-method=thread --max-worker-restart=2 --junitxml=report.xml
        --no-cov
    - name: Upload coverage to Codecov
      if: env.RUN_SUITE == 'true' && github.event_name != 'pull_request' && matrix.os
        == 'ubuntu-latest' && matrix.python-version == '3.11' && steps.reuse.outputs.cache-hit
        != 'true'
      uses: codecov/codecov-action@v4
      with:
        files: coverage.xml
        fail_ci_if_error: false
    - name: Update test count badge
      if: env.RUN_SUITE == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version
        == '3.11' && github.ref == 'refs/heads/main' && github.event_name == 'schedule'
        && true && steps.reuse.outputs.cache-hit != 'true'
      run: |
        TESTS=$(python -c "
        import xml.etree.ElementTree as ET
        root = ET.parse('report.xml').getroot()
        ts = root.find('testsuite')
        print(ts.attrib.get('tests', '0') if ts is not None else root.attrib.get('tests', '0'))
        ")
        echo "Test count: $TESTS"
        # --fail-with-body: surface non-2xx (e.g. 401 expired token) as a
        # CI failure with the response body printed, instead of silently
        # discarding to /dev/null and leaving the badge stale.
        curl --fail-with-body -sS \
          -X PATCH \
          -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
          -d "{\"files\":{\"soup_tests.json\":{\"content\":\"{\\\"schemaVersion\\\":1,\\\"label\\\":\\\"tests\\\",\\\"message\\\":\\\"$TESTS passed\\\",\\\"color\\\":\\\"brightgreen\\\"}\"}}}" \
          "https://api.github.com/gists/65fdc943f85f3b2c46ecddb415c2b779"
    - name: Record the green result of this merge commit
      id: marker
      if: success() && steps.suite.outcome == 'success' && env.RUN_SUITE == 'true'
        && env.REUSE_CELL == 'true' && steps.reuse.outputs.cache-hit != 'true'
      continue-on-error: true
      timeout-minutes: 5
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/suite-green"
        echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/suite-green/result"
    - name: Save the green result of this merge commit
      if: success() && steps.suite.outcome == 'success' && steps.marker.outcome ==
        'success' && env.RUN_SUITE == 'true' && env.REUSE_CELL == 'true' && steps.reuse.outputs.cache-hit
        != 'true'
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/suite-green
        key: suite-green-v1-${{ github.sha }}-${{ matrix.os }}-${{ matrix.python-version
          }}
    if: ${{ !cancelled() }}
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - main
    - release/**
    paths-ignore:
    - docs/**
    - changelog.d/**
    - CONTRIBUTORS.md
    - CONTRIBUTING.md
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
  schedule:
  - cron: 23 3 * * *
  workflow_dispatch:
    inputs:
      matrix:
        description: 'full: the nightly matrix (seven test cells, newest upstream
          stack). approval: the four required test cells and the smoke jobs on the
          pinned stack, as a pull request labelled ci:full runs them (about half the
          job-minutes of full).'
        type: choice
        options:
        - full
        - approval
        default: full
